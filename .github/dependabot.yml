version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "phpunit/phpunit"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "endroid/qr-code"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "php"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

      - dependency-name: "library/mysql"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
